[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
# Coverage gate: the suite currently sits at ~85%. Keep this floor at or below the
# real number so CI stays green and the floor can only ratchet upward over time.
fail_under = 80
