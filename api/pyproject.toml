[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
# SCRUM-161: preserve complete backend statement/branch coverage. Run the full
# suite against the disposable acceptance database before applying this gate.
fail_under = 100
