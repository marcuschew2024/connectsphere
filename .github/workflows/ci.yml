name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Security audit (advisory)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Unit tests and full source coverage
        run: npm run test:coverage

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/browser.xml
        run: npm run test:e2e -- --reporter=html,junit

      - name: Save browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            frontend/playwright-report/
            frontend/coverage/
            frontend/test-results/

  api:
    name: API (Flask)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Validate traceability mappings and evidence tooling
        working-directory: .
        run: |
          ruff check scripts/qa
          python scripts/qa/report.py --validate
          python -m unittest discover -s scripts/qa -p 'test_*.py'

      - name: Start isolated test database
        working-directory: .
        run: |
          docker compose -p connectsphere-acceptance -f compose.acceptance.yml up -d --wait
          docker compose -p connectsphere-acceptance -f compose.acceptance.yml exec -T db sh /sql/tests/run.sh
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:55433/app_users > /dev/null

      - name: Pytest (with coverage)
        env:
          POSTGREST_TEST_URL: http://127.0.0.1:55433
          TEST_EVIDENCE_DIR: test-results
        run: pytest -v --cov=app --cov-branch --cov-report=term-missing --cov-report=json:test-results/coverage.json --cov-report=xml:test-results/coverage.xml --cov-report=html:test-results/coverage-html --junitxml=test-results/pytest.xml

      - name: Save API test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: api/test-results/

      - name: Stop isolated test services
        if: always()
        working-directory: .
        run: docker compose -p connectsphere-acceptance -f compose.acceptance.yml down -v
      - name: Security audit
        run: |
          pip install pip-audit
          pip-audit

  integrated:
    name: Real browser API and database journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt
          npm ci --prefix frontend
          cd frontend
          npx playwright install --with-deps chromium
      - name: Initialise disposable database and verify SQL contracts
        run: |
          docker compose -p connectsphere-integrated -f compose.acceptance.yml up -d --wait
          docker compose -p connectsphere-integrated -f compose.acceptance.yml exec -T db sh /sql/tests/run.sh
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:55433/app_users > /dev/null
      - name: Build and run integrated journeys
        working-directory: frontend
        env:
          QA_PYTHON: python
          NEXT_PUBLIC_API_URL: http://localhost:5001
        run: |
          npm run build
          npm run test:integrated
      - name: Save integrated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-test-results
          path: |
            frontend/playwright-integrated-report/
            frontend/test-results/
      - name: Stop disposable test services
        if: always()
        run: docker compose -p connectsphere-integrated -f compose.acceptance.yml down -v

  traceability:
    name: Assemble release verification evidence
    needs: [frontend, api, integrated]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: evidence
      - name: Build requirement checklist with actual outcomes
        run: |
          python scripts/qa/report.py \
            --backend-junit evidence/api-test-results/pytest.xml \
            --backend-coverage evidence/api-test-results/coverage.json \
            --frontend-junit evidence/browser-test-results/test-results/unit.xml \
            --frontend-coverage evidence/browser-test-results/coverage/coverage-summary.json \
            --browser-junit evidence/browser-test-results/test-results/browser.xml \
            --integrated-junit evidence/integrated-test-results/test-results/integrated.xml \
            --output-dir release-verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification
          path: release-verification/

  test-protection:
    name: Test protection (advisory)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Surface modified/deleted/renamed tests (advisory, does not block)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --diff-filter=MDR --name-only "$BASE_SHA" HEAD -- \
            api/tests supabase/tests frontend/e2e \
            'frontend/src/**/*.test.ts' 'frontend/src/**/*.test.tsx') || true
          if [ -z "$changed" ]; then
            echo "No existing test files were modified, deleted, or renamed."
            exit 0
          fi
          echo "These existing test files were modified/deleted/renamed:"
          echo "$changed"
          echo "::warning::This PR changes existing tests. Reviewer: confirm each change reflects a real behaviour change, not a weakened assertion. (Advisory — not blocking. This check also cannot catch a NEW weak test or a gutted assertion.)"
