name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Save browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: frontend/playwright-report/

  api:
    name: API (Flask)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Start isolated database and email capture
        working-directory: .
        run: |
          docker compose -p connectsphere-acceptance -f compose.acceptance.yml up -d --wait
          docker compose -p connectsphere-acceptance -f compose.acceptance.yml exec -T db sh /sql/tests/run.sh
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:55433/app_users > /dev/null

      - name: Pytest
        env:
          POSTGREST_TEST_URL: http://127.0.0.1:55433
          TEST_EVIDENCE_DIR: test-results
        run: pytest -v --junitxml=test-results/pytest.xml

      - name: Save API test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: api/test-results/

      - name: Stop isolated test services
        if: always()
        working-directory: .
        run: docker compose -p connectsphere-acceptance -f compose.acceptance.yml down -v
