name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Security audit (advisory)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Save browser test evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: browser-test-results
          path: frontend/playwright-report/

  api:
    name: API (Flask)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Start isolated test database
        working-directory: .
        run: |
          docker compose -p connectsphere-acceptance -f compose.acceptance.yml up -d --wait
          docker compose -p connectsphere-acceptance -f compose.acceptance.yml exec -T db sh /sql/tests/run.sh
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:55433/app_users > /dev/null

      - name: Pytest (with coverage)
        env:
          POSTGREST_TEST_URL: http://127.0.0.1:55433
          TEST_EVIDENCE_DIR: test-results
        run: pytest -v --cov=app --cov-report=term-missing --junitxml=test-results/pytest.xml

      - name: Save API test evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: api-test-results
          path: api/test-results/

      - name: Stop isolated test services
        if: always()
        working-directory: .
        run: docker compose -p connectsphere-acceptance -f compose.acceptance.yml down -v
      - name: Security audit
        run: |
          pip install pip-audit
          pip-audit

  test-protection:
    name: Test protection (advisory)
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Surface modified/deleted/renamed tests (advisory, does not block)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --diff-filter=MDR --name-only "$BASE_SHA" HEAD -- \
            api/tests supabase/tests frontend/e2e \
            'frontend/src/**/*.test.ts' 'frontend/src/**/*.test.tsx') || true
          if [ -z "$changed" ]; then
            echo "No existing test files were modified, deleted, or renamed."
            exit 0
          fi
          echo "These existing test files were modified/deleted/renamed:"
          echo "$changed"
          echo "::warning::This PR changes existing tests. Reviewer: confirm each change reflects a real behaviour change, not a weakened assertion. (Advisory — not blocking. This check also cannot catch a NEW weak test or a gutted assertion.)"
